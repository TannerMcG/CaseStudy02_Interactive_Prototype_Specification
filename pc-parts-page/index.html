<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Parts</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Header -->
     <header class="site-header" id="top">
        <div class="header-inner">
            <a class="brand" href="#top" aria-label="PC Parts Home">
                <span class="brand-icon" aria-hidden="true">B</span>
                <span>PC Parts</span>
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="#catalog">Browse Parts</a>
                <a href="#cart" class="cart-nav">

                    <span id="header-cart-count" class="cart-count">0</span>

        </div>

      <main id="main-content" class="page-container">

            <p class="eyebrow">PC Components</p>

          <div class="shop-layout">
            
          </div>

      <footer class="site-footer">
        <div class="footer-inner">
            <span>PC Parts</span>

        </div>
      </footer>
